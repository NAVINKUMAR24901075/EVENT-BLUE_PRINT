<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blueprint Round — IoTVerse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --ink:#0F1420; --ink-2:#171E2E; --ink-3:#20293D;
    --paper:#F3F1EA; --slate:#7C8AA3;
    --amber:#FFB020; --cyan:#3FE0C5; --coral:#FF5C5C; --violet:#8B7CF6;
    --grid-line: rgba(63,224,197,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-color:var(--ink);
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size:34px 34px;
    color:var(--paper); font-family:'Inter',sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  #app{min-height:100vh;display:flex;flex-direction:column;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0;letter-spacing:-0.01em;}
  .mono{font-family:'Space Mono',monospace;}
  .screen{max-width:1000px;margin:0 auto;padding:26px 20px 60px;width:100%;flex:1;}
  .eyebrow{text-transform:uppercase;font-size:12px;letter-spacing:.14em;color:var(--slate);font-weight:700;margin-bottom:6px;}
  .card{background:var(--ink-2);border-radius:18px;padding:24px;border:1px solid rgba(255,255,255,0.06);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--amber);color:var(--ink);border:none;
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;padding:13px 24px;border-radius:999px;cursor:pointer;
    text-transform:uppercase;letter-spacing:.04em;transition:transform .12s, filter .12s;}
  .btn:hover{filter:brightness(1.08);transform:translateY(-1px);}
  .btn:disabled{opacity:.35;cursor:not-allowed;transform:none;}
  .btn-ghost{background:transparent;color:var(--paper);border:1.5px solid rgba(255,255,255,0.18);}
  .btn-ghost:hover{border-color:var(--paper);filter:none;}
  .btn-cyan{background:var(--cyan);}
  .btn-coral{background:var(--coral);}
  .btn-sm{padding:9px 16px;font-size:12px;}
  .btn-block{width:100%;}
  input[type=text],input[type=number]{
    width:100%;background:var(--ink);border:1.5px solid rgba(255,255,255,0.12);color:var(--paper);
    font-family:'Inter',sans-serif;font-size:16px;padding:13px 15px;border-radius:12px;outline:none;}
  input:focus{border-color:var(--amber);}
  label{font-size:12px;color:var(--slate);font-weight:700;display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em;}
  .field{margin-bottom:16px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .center{text-align:center;}
  .divider{height:1px;background:rgba(255,255,255,0.06);margin:22px 0;}
  .empty{color:var(--slate);font-size:14px;padding:16px 0;}
  .pill{display:inline-block;background:var(--ink-3);color:var(--slate);font-size:11px;font-weight:700;padding:6px 13px;border-radius:999px;text-transform:uppercase;letter-spacing:.06em;}
  .pill.live{background:rgba(63,224,197,0.14);color:var(--cyan);}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid rgba(255,255,255,0.06);}
  .brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;}
  .brand .dot{color:var(--amber);}

  .landing-hero{text-align:center;padding:64px 20px 36px;}
  .landing-hero h1{font-size:48px;line-height:1.04;}
  .landing-hero .accent{color:var(--amber);}
  .landing-hero p{color:var(--slate);font-size:16px;margin:14px auto 32px;max-width:480px;}
  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:560px;margin:0 auto;}
  @media(max-width:560px){.role-grid{grid-template-columns:1fr;} .landing-hero h1{font-size:34px;}}
  .role-card{background:var(--ink-2);border:1.5px solid rgba(255,255,255,0.06);border-radius:16px;padding:24px 20px;cursor:pointer;text-align:left;transition:border-color .15s, transform .15s;}
  .role-card:hover{border-color:var(--amber);transform:translateY(-2px);}
  .role-card .tag{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--amber);font-weight:700;margin-bottom:8px;}
  .role-card h3{font-size:19px;margin-bottom:5px;}
  .role-card p{color:var(--slate);font-size:13.5px;margin:0;line-height:1.4;}

  .problem-check{display:flex;gap:14px;align-items:flex-start;padding:16px;border:1.5px solid rgba(255,255,255,0.08);border-radius:14px;cursor:pointer;margin-bottom:10px;transition:border-color .15s;}
  .problem-check:hover{border-color:var(--amber);}
  .problem-check.on{border-color:var(--cyan);background:rgba(63,224,197,0.06);}
  .problem-check .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--slate);flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:12px;}
  .problem-check.on .box{border-color:var(--cyan);background:var(--cyan);color:var(--ink);}
  .problem-check h4{margin:0 0 3px;font-size:15px;font-family:'Space Grotesk',sans-serif;}
  .problem-check p{margin:0;color:var(--slate);font-size:13px;line-height:1.4;}

  .qr-box{background:var(--paper);padding:14px;border-radius:16px;display:inline-block;}
  .code-display{font-family:'Space Mono',monospace;font-size:40px;letter-spacing:.1em;color:var(--amber);}
  .team-chip{display:inline-flex;align-items:center;gap:8px;background:var(--ink-3);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;margin:4px 6px 4px 0;}

  .ringwrap{display:flex;flex-direction:column;align-items:center;gap:4px;}
  .ringlabel{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--slate);font-weight:700;}

  .timebar-wrap{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
  .timebar-track{flex:1;height:10px;border-radius:999px;background:var(--ink-3);overflow:hidden;}
  .timebar-fill{height:100%;border-radius:999px;transition:width .25s linear;}
  .timebar-txt{font-family:'Space Mono',monospace;font-weight:700;font-size:15px;white-space:nowrap;}

  .tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
  .ptile{background:var(--ink-2);border:1.5px solid rgba(255,255,255,0.07);border-radius:16px;padding:18px;cursor:pointer;transition:border-color .15s, transform .15s;text-align:left;}
  .ptile:hover{border-color:var(--amber);transform:translateY(-2px);}
  .ptile.done{border-color:var(--cyan);}
  .ptile .pnum{font-family:'Space Mono',monospace;color:var(--slate);font-size:12px;margin-bottom:6px;}
  .ptile h4{font-size:16px;margin-bottom:6px;}
  .ptile .pstatus{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--slate);}
  .ptile.done .pstatus{color:var(--cyan);}

  .opt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  @media(max-width:600px){.opt-grid{grid-template-columns:1fr;}}
  .selopt{display:flex;align-items:center;gap:12px;border:1.5px solid rgba(255,255,255,0.09);background:var(--ink-3);
    border-radius:14px;padding:15px 16px;cursor:pointer;text-align:left;font-family:'Inter',sans-serif;font-size:15px;font-weight:600;color:var(--paper);
    transition:border-color .12s, transform .1s; width:100%;}
  .selopt:hover{border-color:var(--amber);}
  .selopt.sel{border-color:var(--cyan);background:rgba(63,224,197,0.08);}
  .selopt .em{font-size:20px;}
  .selopt .costbadge{margin-left:auto;font-family:'Space Mono',monospace;font-size:12px;color:var(--slate);}

  .chainzone{background:var(--ink-3);border-radius:16px;padding:18px;margin-top:6px;}
  .slots{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .slot{flex:1;min-width:90px;height:64px;border:2px dashed rgba(255,255,255,0.15);border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-size:12px;color:var(--slate);text-align:center;padding:6px;}
  .slot.filled{border-style:solid;border-color:var(--cyan);background:rgba(63,224,197,0.08);color:var(--paper);font-weight:600;}
  .pool{display:flex;gap:10px;flex-wrap:wrap;}
  .chip{background:var(--ink-2);border:1.5px solid rgba(255,255,255,0.1);border-radius:12px;padding:10px 14px;cursor:pointer;font-size:13px;font-weight:600;transition:border-color .12s;}
  .chip:hover{border-color:var(--amber);}

  table{width:100%;border-collapse:collapse;}
  th,td{text-align:left;padding:11px 9px;border-bottom:1px solid rgba(255,255,255,0.06);font-size:13.5px;}
  th{color:var(--slate);text-transform:uppercase;letter-spacing:.06em;font-size:11px;font-weight:700;}
  td.pts{font-family:'Space Mono',monospace;color:var(--cyan);font-weight:700;}

  .lead-row{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,0.06);}
  .lead-rank{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;color:var(--slate);width:32px;}
  .lead-rank.gold{color:var(--amber);}
  .lead-name{flex:1;font-weight:600;}
  .lead-score{font-family:'Space Mono',monospace;font-weight:700;color:var(--cyan);}

  .breakdown-row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,0.06);}
  .breakdown-row:last-child{border-bottom:none;}
  .breakdown-row .bl{font-weight:600;}
  .breakdown-row .bd{color:var(--slate);font-size:12.5px;margin-top:3px;line-height:1.4;max-width:520px;}
  .breakdown-row .bp{font-family:'Space Mono',monospace;font-weight:700;color:var(--cyan);white-space:nowrap;}
  .breakdown-row .bp.zero{color:var(--coral);}
  .badge-v{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 9px;border-radius:999px;margin-left:8px;}
  .badge-v.optimal{background:rgba(63,224,197,0.15);color:var(--cyan);}
  .badge-v.acceptable{background:rgba(255,176,32,0.15);color:var(--amber);}
  .badge-v.incorrect{background:rgba(255,92,92,0.15);color:var(--coral);}
  .scenario{font-size:16px;line-height:1.5;font-style:italic;color:var(--paper);}
  .status-banner{text-align:center;padding:36px 20px;color:var(--slate);}
  .status-banner h2{color:var(--paper);margin-bottom:8px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   BLUEPRINT ROUND — IoTVerse chain-building challenge
   Teams pick a sensor + connectivity card, then arrange the
   5-stage pipeline (Sensor -> Connectivity -> Cloud -> Data -> Action).
   Auto-scored against the answer-key rubric. Shared timer.
========================================================= */

// ---------- problem bank (from Round 1 Problem Bank & Answer Keys) ----------
const PROBLEMS = [

    ],
    correctSensors:["Fill-Level/Ultrasonic Sensor"],

      {key:"cellular", label:"Cellular (5G/4G)", emoji:"📡", baseCost:25, validity:"acceptable", points:7, penalty:15, reason:"Works but unnecessarily expensive for infrequent fill-level updates."},

  {

    card:"A residential apartment complex loses thousands of liters of water every month to undetected pipe leaks.",

      {label:"Temperature Sensor", emoji:"🌡️"},
      {label:"Water Level Sensor", emoji:"💧"},
      {label:"GPS/Location Sensor", emoji:"📍"}
    ],
    correctSensors:["Air Quality Sensor"],
    connectivity:[
      {key:"lorawan", label:"LoRaWAN", emoji:"📡", baseCost:20, validity:"optimal", points:10, penalty:0, reason:"Outdoor monitoring stations spread across a zone, low power."},
      {key:"wifi", label:"Wi-Fi", emoji:"📶", baseCost:15, validity:"acceptable", points:7, penalty:10, reason:"Works if stations are within existing Wi-Fi coverage."},

  {
    id:8, title:"Farm Irrigation Waste",

    ],

      {key:"wifi", label:"Wi-Fi", emoji:"📶", baseCost:15, validity:"acceptable", points:7, penalty:10, reason:"Works only if fields are within existing Wi-Fi coverage."},
      {key:"cellular", label:"Cellular (5G/4G)", emoji:"📡", baseCost:25, validity:"incorrect", points:0, penalty:0, reason:"Unnecessarily expensive for simple periodic soil readings."},

const CHAIN_TYPES = ["sensor","connectivity","cloud","data","action"];

// ---------- state ----------
const state = {
  role:null, screen:'landing', code:null, session:null,
  teamId:null, teamName:null,
  draftProblemIds:[], draftMinutes:20,
  currentProblemId:null, editingProblem:false,
  draft:{sensor:null, connKey:null},
  chainPoolFull:[], chainSeqIds:[],
  pollTimer:null, tickTimer:null, autoEndTriggered:false,
  teamToken:null, tabId:null, securityTimer:null, securityChannel:null,
  securityMessage:'',
  error:'', joining:false
};

// ---------- SERVER STORAGE ----------
async function loadSession(code){
  try{
    const response = await fetch(`/api/sessions/${encodeURIComponent(code)}`);
    if(!response.ok) return null;
    return await response.json();
  }catch(e){
    console.error("Failed to load session:", e);
    return null;
  }
}

async function saveSession(code, obj){
  try{
    const headers = {'Content-Type':'application/json'};
    if(state.role==='team' && state.teamId && state.teamToken){
      headers['X-Team-Id']=state.teamId;
      headers['X-Team-Token']=state.teamToken;
      headers['X-Team-Tab']=state.tabId || '';
    }
    const response = await fetch(`/api/sessions/${encodeURIComponent(code)}`, {
      method: 'PUT',
      headers,
      body: JSON.stringify(obj)
    });

    if(!response.ok){
      console.error("Failed to save session:", response.status);
      return false;
    }

    return true;
  }catch(e){
    console.error("Failed to save session:", e);
    return false;
  }
}
function randCode(){ return String(Math.floor(1000+Math.random()*9000)); }
function randId(){ return Math.random().toString(36).slice(2,9); }

function teamStorageKey(code){ return `blueprint-team-token:${code}`; }
function teamTabKey(code){ return `blueprint-team-tab:${code}`; }

function beginTeamSecurity(){
  if(state.role!=='team' || !state.code || !state.teamId || !state.teamToken) return;
  state.tabId = sessionStorage.getItem(teamTabKey(state.code));
  if(!state.tabId){
    state.tabId = randId();
    sessionStorage.setItem(teamTabKey(state.code), state.tabId);
  }

  const lockKey = `blueprint-active-tab:${state.code}:${state.teamId}`;
  const writeLock = () => localStorage.setItem(lockKey, JSON.stringify({tabId:state.tabId, at:Date.now()}));

  if(state.securityChannel) state.securityChannel.close();
  try{
    state.securityChannel = new BroadcastChannel(`blueprint-security:${state.code}:${state.teamId}`);
    state.securityChannel.onmessage = async ev => {
      if(ev.data && ev.data.type==='HELLO' && ev.data.tabId!==state.tabId){
        state.securityChannel.postMessage({type:'CONFLICT', tabId:state.tabId});
        await disqualifyTeam('The quiz was opened in another tab or window.');
      }else if(ev.data && ev.data.type==='CONFLICT' && ev.data.tabId!==state.tabId){
        await disqualifyTeam('The quiz was opened in another tab or window.');
      }
    };
    state.securityChannel.postMessage({type:'HELLO', tabId:state.tabId});
  }catch(e){}

  const onStorage = async ev => {
    if(ev.key!==lockKey || !ev.newValue) return;
    try{
      const v=JSON.parse(ev.newValue);
      if(v.tabId && v.tabId!==state.tabId){
        await disqualifyTeam('The quiz was opened in another tab or window.');
      }
    }catch(e){}
  };
  window.addEventListener('storage', onStorage);
  state.securityStorageHandler = onStorage;

  writeLock();
  if(state.securityTimer) clearInterval(state.securityTimer);
  state.securityTimer = setInterval(async ()=>{
    if(state.role!=='team') return;
    const current = localStorage.getItem(lockKey);
    try{
      const v=current ? JSON.parse(current) : null;
      if(v && v.tabId!==state.tabId){
        await disqualifyTeam('The quiz was opened in another tab or window.');
        return;
      }
    }catch(e){}
    writeLock();
    await validateTeamSecurity();
  }, 2000);
}

function stopTeamSecurity(){
  if(state.securityTimer) clearInterval(state.securityTimer);
  state.securityTimer=null;
  if(state.securityChannel){ try{state.securityChannel.close();}catch(e){} }
  state.securityChannel=null;
  if(state.securityStorageHandler) window.removeEventListener('storage', state.securityStorageHandler);
  state.securityStorageHandler=null;
}

async function validateTeamSecurity(){
  if(state.role!=='team' || !state.code || !state.teamId || !state.teamToken || !state.tabId) return false;
  try{
    const r=await fetch('/api/team/validate',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({code:state.code,teamId:state.teamId,token:state.teamToken,tabId:state.tabId})
    });
    if(!r.ok){
      const d=await r.json().catch(()=>({}));
      await disqualifyTeam(d.error || 'This quiz attempt is no longer valid.');
      return false;
    }
    return true;
  }catch(e){ return true; }
}

async function disqualifyTeam(message){
  if(state.securityMessage) return;
  state.securityMessage = message || 'This quiz attempt has been disqualified.';
  stopTeamSecurity();
  try{
    await fetch('/api/team/disqualify',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({code:state.code,teamId:state.teamId,token:state.teamToken,reason:state.securityMessage})
    });
  }catch(e){}
  state.error=state.securityMessage;
  state.screen='team-ended';
  render();
}

async function markJoinPageNavigation(){
  if(state.role==='team' && state.teamId && state.teamToken){
    await disqualifyTeam('You left the quiz and returned to the join page. This attempt is disqualified.');
  }
}

async function checkClosedOrDuplicatedAttempt(code){
  const token=localStorage.getItem(teamStorageKey(code));
  const tab=sessionStorage.getItem(teamTabKey(code));
  if(token && !tab){
    try{
      const decoded=JSON.parse(token);
      await fetch('/api/team/disqualify',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({code,teamId:decoded.teamId,token:decoded.token,reason:'The quiz was closed and reopened.'})
      });
    }catch(e){}
    localStorage.removeItem(teamStorageKey(code));
    return true;
  }
  return false;
}

function shuffle(arr){ arr=[...arr]; for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
function escapeHtml(str){ return String(str||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fmt(ms){
  const total = Math.max(0, Math.ceil(ms/1000));
  const m = Math.floor(total/60); const s = total%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

// ---------- polling / ticking ----------
function startPolling(){
  stopPolling();
  state.pollTimer = setInterval(async ()=>{
    if(!state.code) return;
    const s = await loadSession(state.code);
    if(s){ state.session = s; autoAdvance(); }
    render();
  }, 1500);
}
function stopPolling(){ if(state.pollTimer) clearInterval(state.pollTimer); state.pollTimer=null; }
function startTicker(){ stopTicker(); state.tickTimer = setInterval(tick, 250); }
function stopTicker(){ if(state.tickTimer) clearInterval(state.tickTimer); state.tickTimer=null; }

function autoAdvance(){
  const s = state.session; if(!s || state.role!=='team') return;

  if(s.phase==='ended'){
    if(state.screen!=='team-ended') state.screen='team-ended';
    return;
  }

  const wallet = s.wallets[state.teamId] || {spent:0, remaining:100};
  const finished = !!(s.finished && s.finished[state.teamId]);

  // Once the team has spent all 100 IoT-Coins, they cannot open
  // or attempt another problem. Move them directly to the Finish screen.
  if(s.phase==='round' && (wallet.remaining <= 0 || finished)){
    if(state.screen!=='team-finish') state.screen='team-finish';
    return;
  }

  if(state.screen==='team-wait' && s.phase==='round'){ state.screen='team-round'; }
}

function roundRemainingMs(){
  const s = state.session;
  if(!s || !s.roundStartedAt) return s ? s.roundDurationMs : 0;
  return Math.max(0, s.roundDurationMs - (Date.now()-s.roundStartedAt));
}

function tick(){
  if(state.screen==='host-round'){
    const rem = roundRemainingMs();
    if(rem<=0 && state.session && state.session.phase==='round' && !state.autoEndTriggered){
      state.autoEndTriggered = true;
      handleEndRoundNow();
      return;
    }
  }
  render();
}

function builderView(problem, timeUp, s){
  const d = state.draft;
  const bothChosen = d.sensor && d.connKey;
  const filledSlots = state.chainSeqIds.length;
  const chipById = id => state.chainPoolFull.find(c=>c.id===id);
  const poolChips = state.chainPoolFull.filter(c=>!state.chainSeqIds.includes(c.id));

  const existingCostForThisProblem = ((s.submissions[state.teamId]||{})[problem.id]||{}).coinCost || 0;
  const walletBefore = (s.wallets[state.teamId]||{spent:0}).spent - existingCostForThisProblem;
  let costPreview = '';
  if(d.connKey){
    const connOpt = problem.connectivity.find(c=>c.key===d.connKey);
    const cost = connOpt.baseCost + (connOpt.validity==='acceptable' ? connOpt.penalty : 0);
    const projected = walletBefore + cost;
    const over = projected > 100;
    costPreview = `<p style="margin:10px 0 0;font-size:13px;color:${over?'var(--coral)':'var(--slate)'};">
      This choice costs <strong style="color:${over?'var(--coral)':'var(--amber)'};">${cost} IoT-Coins</strong>.
      Projected total spend across your submitted problems: <strong>${projected} / 100</strong>${over?' — over budget, this design will lose the 5 budget points':''}.
    </p>`;
  }

  return `
  <button class="btn-ghost btn btn-sm" data-action="back-to-problems" style="margin-bottom:16px;">← Back to problems</button>
  <div class="card" style="margin-bottom:18px;"><div class="eyebrow">Problem ${problem.id}</div><h2>${escapeHtml(problem.title)}</h2><p class="scenario">"${escapeHtml(problem.card)}"</p></div>

  ${timeUp ? `<div class="card center"><p style="color:var(--coral);margin:0;">Time's up — this design can no longer be submitted.</p></div>` : `

  <div class="card" style="margin-bottom:16px;">
    <div class="eyebrow">Step 1 — Choose your sensor</div>
    <div class="opt-grid" style="margin-top:12px;">
      ${problem.sensorOptions.map(o=>`
        <button class="selopt ${d.sensor && d.sensor.label===o.label ?'sel':''}" data-action="pick-sensor" data-label="${escapeHtml(o.label)}">
          <span class="em">${o.emoji}</span><span>${escapeHtml(o.label)}</span>
        </button>`).join('')}
    </div>
  </div>

  <div class="card" style="margin-bottom:16px;">
    <div class="eyebrow">Step 2 — Choose your connectivity</div>
    <div class="opt-grid" style="margin-top:12px;">
      ${problem.connectivity.map(c=>`
        <button class="selopt ${d.connKey===c.key?'sel':''}" data-action="pick-conn" data-key="${c.key}">
          <span class="em">${c.emoji}</span><span>${escapeHtml(c.label)}</span><span class="costbadge">${c.baseCost} coins</span>
        </button>`).join('')}
    </div>
    ${costPreview}
  </div>

  ${bothChosen ? `
  <div class="card">
    <div class="eyebrow">Step 3 — Arrange the pipeline</div>
    <div class="chainzone">
      <div class="slots">
        ${[0,1,2,3,4].map(i=>{
          const id = state.chainSeqIds[i];
          const chip = id? chipById(id): null;
          return `<div class="slot ${chip?'filled':''}">${chip? chip.emoji+' '+escapeHtml(chip.label) : (i+1)}</div>`;
        }).join('')}
      </div>
      <div class="pool">
        ${poolChips.map(c=>`<button class="chip" data-action="add-chip" data-id="${c.id}">${c.emoji} ${escapeHtml(c.label)}</button>`).join('')}
      </div>
      ${filledSlots>0 ? `<div style="margin-top:14px;"><button class="btn-ghost btn btn-sm" data-action="reset-chain">Reset Order</button></div>` : ''}
    </div>
  </div>` : `<div class="empty">Pick a sensor and a connectivity option to unlock the pipeline builder.</div>`}

  <div class="divider"></div>
  <button class="btn btn-cyan" data-action="submit-design" ${(!bothChosen || filledSlots<5)?'disabled':''}>Submit Design →</button>
  `}
  `;
}

function teamFinishScreen(){
  const s = state.session;
  const wallet = s.wallets[state.teamId] || {spent:100, remaining:0};
  const myScore = s.scores[state.teamId] || 0;

  return `
  <div class="status-banner">
    <div class="eyebrow">100 IoT-Coins used</div>
    <h2>You're finished!</h2>
    <p>Your team has used the complete 100 IoT-Coin budget.</p>
  </div>

  <div class="card center" style="max-width:520px;margin:0 auto;">
    <div class="eyebrow">Budget exhausted</div>
    <div class="mono" style="font-size:46px;color:var(--amber);font-weight:700;">${wallet.spent} / 100</div>
    <p style="color:var(--slate);margin:8px 0 4px;">IoT-Coins used</p>
    <div class="divider"></div>
    <p style="margin:0 0 18px;color:var(--slate);">No more problems can be attempted. Your completed designs are locked.</p>
    <div class="row" style="justify-content:center;gap:10px;">
      <span class="pill live">Score: ${myScore}</span>
      <span class="pill">Questions completed: ${Object.keys(s.submissions[state.teamId]||{}).length}</span>
    </div>
    <button class="btn btn-cyan" style="margin-top:20px;" data-action="finish-round">Finish →</button>
  </div>
  `;
}

function teamEndedScreen(){
  const s = state.session;
  const ids = Object.keys(s.teams);
  const ranked = ids.map(id=>({id,score:s.scores[id]||0})).sort((a,b)=>b.score-a.score);
  const myRank = ranked.findIndex(r=>r.id===state.teamId)+1;
  return `
  <div class="status-banner">
    <div class="eyebrow">Round complete</div>
    <h2>${escapeHtml(state.teamName)} finished #${myRank||'-'}</h2>
  </div>
  <div class="card">${leaderboardHTML(s)}</div>
  `;
}

// ---------- side effects ----------
function afterRender(){
  if(state.screen==='host-lobby'){
    const holder = document.getElementById('qrHolder');
    if(holder && window.QRCode){
      holder.innerHTML='';
      const joinUrl = location.origin + location.pathname + '?session=' + state.code;
      new QRCode(holder, {text:joinUrl, width:180, height:180, colorDark:'#0F1420', colorLight:'#F3F1EA'});
    }
  }
  const needsTick = ['host-round','team-round','team-problem'].includes(state.screen);
  if(needsTick) startTicker(); else stopTicker();
}

// ---------- scoring ----------
function computeChainPool(problem){
  const connOpt = problem.connectivity.find(c=>c.key===state.draft.connKey);
  const sensorOpt = state.draft.sensor;

  // The one correct chip for each stage — these are the only chips that can
  // score a point, and only when placed in their matching slot.
  const correctChips = [
    {id:'sensor-correct', type:'sensor', label:sensorOpt.label, emoji:sensorOpt.emoji, correct:true},
    {id:'conn-correct', type:'connectivity', label:connOpt.label, emoji:connOpt.emoji, correct:true},
    {id:'cloud-correct', type:'cloud', label:'Cloud', emoji:'☁️', correct:true},
    {id:'data-correct', type:'data', label:problem.dataLabel, emoji:'📊', correct:true},
    {id:'action-correct', type:'action', label:problem.actionLabel, emoji:problem.actionEmoji, correct:true}
  ];

  // Decoy chips — plausible-looking but wrong choices in each category, so
  // teams must first pick the RIGHT chip for this scenario, then put it in
  // the RIGHT slot. A decoy placed anywhere scores 0 for that slot; the
  // correct chip only scores if it also lands in its correct position.
  const sensorDecoys = shuffle(problem.sensorOptions.filter(o=>o.label!==sensorOpt.label))
    .slice(0,2)
    .map((o,i)=>({id:'sensor-decoy'+i, type:'sensor', label:o.label, emoji:o.emoji, correct:false}));

  const connDecoys = shuffle(problem.connectivity.filter(c=>c.key!==connOpt.key))
    .slice(0,2)
    .map((c,i)=>({id:'conn-decoy'+i, type:'connectivity', label:c.label, emoji:c.emoji, correct:false}));

  const otherProblems = PROBLEMS.filter(p=>p.id!==problem.id);
  const dataDecoys = shuffle(otherProblems).slice(0,2)
    .map((p,i)=>({id:'data-decoy'+i, type:'data', label:p.dataLabel, emoji:'📊', correct:false}));
  const actionDecoys = shuffle(otherProblems).slice(0,2)
    .map((p,i)=>({id:'action-decoy'+i, type:'action', label:p.actionLabel, emoji:p.actionEmoji, correct:false}));

  state.chainPoolFull = shuffle([...correctChips, ...sensorDecoys, ...connDecoys, ...dataDecoys, ...actionDecoys]);
  state.chainSeqIds = [];
}

// ---------- IoT-Coin budget ----------
// Recomputes each submission's budget score and the team's wallet by walking
// the round's problems in canonical order and accumulating coin spend.
// A design only earns its 5 budget points if the team's running total is
// still within the shared 100 IoT-Coin allowance at that point.
function recomputeTeamBudget(teamId, s){
  let running = 0;
  const mySubs = s.submissions[teamId] || {};
  for(const pid of s.problemIds){
    const sub = mySubs[pid];
    if(!sub) continue;
    running += sub.coinCost;
    sub.budgetPts = running<=100 ? 5 : 0;
    sub.runningAfter = running;
    sub.total = sub.sensorPts + sub.connPts + sub.budgetPts + sub.chainPts;
  }
  s.wallets[teamId] = {spent: running, remaining: 100 - running};
  s.scores[teamId] = Object.values(mySubs).reduce((sum,r)=>sum+r.total,0);
}

// ---------- actions ----------
async function handleAddQuestionNoop(){}

async function handleOpenLobby(){
  const minutesInput = document.getElementById('roundMinutes');
  const minutes = minutesInput ? Math.max(1, parseInt(minutesInput.value,10)||20) : state.draftMinutes;
  state.draftMinutes = minutes;
  const session = {
    createdAt: Date.now(),
    phase: 'lobby',
    problemIds: state.draftProblemIds.slice(),
    roundDurationMs: minutes*60000,
    roundStartedAt: null,
    teams:{}, scores:{}, submissions:{}, wallets:{}, finished:{}
  };
  await saveSession(state.code, session);
  state.session = session;
  state.screen = 'host-lobby';
  startPolling();
  render();
}

async function handleStartRound(){
  const s = await loadSession(state.code) || state.session;
  s.phase='round'; s.roundStartedAt=Date.now();
  await saveSession(state.code, s);
  state.session = s; state.autoEndTriggered=false;
  state.screen='host-round';
  render();
}

async function handleEndRoundNow(){
  const s = await loadSession(state.code) || state.session;
  s.phase='ended';
  await saveSession(state.code, s);
  state.session = s;
  if(state.role==='host') state.screen='host-ended';
  render();
}

async function handleJoinSession(){
  if(state.joining) return;

  const code = document.getElementById('joinCode').value.trim();
  const name = document.getElementById('joinName').value.trim();
  if(!/^[0-9]{4}$/.test(code)){ state.error='Enter a valid 4-digit code.'; render(); return; }
  if(!name){ state.error='Enter a team name.'; render(); return; }

  const existingToken=localStorage.getItem(teamStorageKey(code));
  if(existingToken){
    state.error='This quiz attempt is already active on this device. Reopening or using another tab/device is not allowed.';
    render();
    return;
  }

  state.joining = true;
  render();

  try{
    const response=await fetch('/api/team/join',{

      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({code,name})
    });
    const data=await response.json().catch(()=>({}));
    if(!response.ok){
      state.joining = false;
      state.error=data.error || 'Unable to join this quiz.';
      render();
      return;
    }

    const s=data.session;
    state.error='';
    state.code=code;
    state.session=s;
    state.teamId=data.teamId;
    state.teamName=data.teamName;
    state.teamToken=data.token;
    state.role='team';
    state.joining = false;

    localStorage.setItem(teamStorageKey(code), JSON.stringify({teamId:data.teamId,token:data.token}));
    sessionStorage.setItem(teamTabKey(code), randId());

    // IMPORTANT: after a successful join, go straight to the quiz screen.
    // If the host has not started the timed round yet, the quiz screen remains
    // visible and clearly shows that the round is waiting for the host.
    // Once the host starts, polling automatically switches the state to live.
    state.screen = s.phase==='ended' ? 'team-ended' : 'team-round';
    startPolling();
    render();
    beginTeamSecurity();
    history.pushState({blueprintTeam:true,code},'',location.href);
  }catch(e){
    state.joining = false;
    state.error='Unable to connect to the quiz server.';
    render();
  }
}
async function handleSubmitDesign(){
  const s = await loadSession(state.code) || state.session;

  if(s.phase==='ended'){
    state.session=s;
    state.screen='team-ended';
    render();
    return;
  }

  if(!s.wallets[state.teamId]){
    s.wallets[state.teamId] = {spent:0, remaining:100};
  }

  const wallet = s.wallets[state.teamId];

  // No more problems are allowed once the 100-coin budget is exhausted.
  if(wallet.remaining <= 0){
    if(!s.finished) s.finished = {};
    s.finished[state.teamId] = true;
    await saveSession(state.code, s);
    state.session=s;
    state.screen='team-finish';
    render();
    return;
  }

  const problem = PROBLEMS.find(p=>p.id===state.currentProblemId);
  if(!problem || !state.draft.sensor || !state.draft.connKey){
    state.error='Complete the design before submitting.';
    render();
    return;
  }

  // A completed problem cannot be submitted again or redesigned.
  const existingSubs = s.submissions[state.teamId] || {};
  if(existingSubs[problem.id]){
    state.editingProblem=false;
    state.session=s;
    state.screen='team-round';
    render();
    return;
  }

  const connOpt = problem.connectivity.find(c=>c.key===state.draft.connKey);
  if(!connOpt){
    state.error='Please choose a valid connectivity option.';
    render();
    return;
  }

  const sensorPts = problem.correctSensors.includes(state.draft.sensor.label) ? 10 : 0;
  const connPts = connOpt.points;
  const coinCost = connOpt.baseCost + (connOpt.validity==='acceptable' ? connOpt.penalty : 0);

  // Never allow the team to spend more than its remaining 100 IoT-Coins.
  if(coinCost > wallet.remaining){
    state.error=`This design costs ${coinCost} IoT-Coins, but only ${wallet.remaining} remain. Choose a lower-cost connectivity option.`;
    render();
    return;
  }

  const chosenChips = state.chainSeqIds.map(id => state.chainPoolFull.find(c=>c.id===id));
  // Award 1 point per slot that holds BOTH the right chip (not a decoy) AND
  // the right position for that chip. A decoy in any slot scores 0 for that
  // slot; the correct chip out of position also scores 0 for that slot —
  // only the other, correctly-placed slots keep their points.
  const chainPts = CHAIN_TYPES.reduce((pts, type, i) => {
    const chip = chosenChips[i];
    return pts + (chip && chip.correct && chip.type === type ? 1 : 0);
  }, 0);
  const chainCorrect = chainPts === CHAIN_TYPES.length;

  const result = {
    sensorLabel: state.draft.sensor.label, sensorPts,
    connLabel: connOpt.label, connValidity: connOpt.validity, connPts, connReason: connOpt.reason,
    coinCost, budgetPts:0, runningAfter:0, chainPts, total:0
  };

  if(!s.submissions[state.teamId]) s.submissions[state.teamId] = {};
  s.submissions[state.teamId][problem.id] = result;

  recomputeTeamBudget(state.teamId, s);

  if(!s.finished) s.finished = {};

  // Exactly 0 coins means the team is finished immediately.
  if(s.wallets[state.teamId].remaining === 0){
    s.finished[state.teamId] = true;
  }

  await saveSession(state.code, s);

  state.session = s;
  state.editingProblem = false;
  state.error='';

  if(s.finished[state.teamId]){
    state.screen='team-finish';
  }else{
    state.screen='team-problem';
  }

  render();
}

// ---------- click delegation ----------
document.addEventListener('click', async (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.getAttribute('data-action');

  if(state.role==='team' && !['join-session','pick-sensor','pick-conn','add-chip','reset-chain','submit-design','finish-round'].includes(action)){
    const ok=await validateTeamSecurity();
    if(!ok) return;
  }

  if(action==='go-host'){
    state.role='host'; state.code=randCode();
    state.draftProblemIds=[]; state.draftMinutes=20;
    state.screen='host-problems'; render();
  }
  else if(action==='go-team-join'){ state.role='team'; state.screen='team-join'; render(); }
  else if(action==='toggle-problem'){
    const id = parseInt(el.getAttribute('data-id'),10);
    const i = state.draftProblemIds.indexOf(id);
    if(i>=0) state.draftProblemIds.splice(i,1); else state.draftProblemIds.push(id);
    render();
  }
  else if(action==='select-all-problems'){ state.draftProblemIds = PROBLEMS.map(p=>p.id); render(); }
  else if(action==='clear-problems'){ state.draftProblemIds=[]; render(); }
  else if(action==='go-host-timer'){ state.screen='host-timer'; render(); }
  else if(action==='back-to-problems' && state.role==='host'){ state.screen='host-problems'; render(); }
  else if(action==='back-to-problems' && state.role==='team'){
    const s = await loadSession(state.code); if(s) state.session=s;
    state.screen = (state.session.phase==='ended') ? 'team-ended' : 'team-round';
    render();
  }
  else if(action==='open-lobby') handleOpenLobby();
  else if(action==='start-round') handleStartRound();
  else if(action==='end-round-now') handleEndRoundNow();
  else if(action==='join-session') handleJoinSession();
  else if(action==='open-problem'){
    const s = await loadSession(state.code) || state.session;
    state.session = s;

    const wallet = s.wallets[state.teamId] || {spent:0, remaining:100};

    // Block every new question after all 100 IoT-Coins are used.
    if(s.phase==='ended' || wallet.remaining <= 0 || (s.finished && s.finished[state.teamId])){
      state.screen = s.phase==='ended' ? 'team-ended' : 'team-finish';
      render();
      return;
    }

    state.currentProblemId = parseInt(el.getAttribute('data-id'),10);
    state.editingProblem = false;
    state.draft = {sensor:null, connKey:null};
    state.chainPoolFull=[]; state.chainSeqIds=[];
    state.error='';
    state.screen='team-problem'; render();
  }


  else if(action==='pick-sensor'){
    const label = el.getAttribute('data-label');
    const problem = PROBLEMS.find(p=>p.id===state.currentProblemId);
    const opt = problem.sensorOptions.find(o=>o.label===label);
    state.draft.sensor = opt;
    if(state.draft.connKey) computeChainPool(problem);
    render();
  }
  else if(action==='pick-conn'){
    const key = el.getAttribute('data-key');
    state.draft.connKey = key;
    const problem = PROBLEMS.find(p=>p.id===state.currentProblemId);
    if(state.draft.sensor) computeChainPool(problem);
    render();
  }
  else if(action==='add-chip'){
    const id = el.getAttribute('data-id');
    if(!state.chainSeqIds.includes(id) && state.chainSeqIds.length<5) state.chainSeqIds.push(id);
    render();
  }
  else if(action==='reset-chain'){ state.chainSeqIds=[]; render(); }
  else if(action==='submit-design') handleSubmitDesign();
  else if(action==='finish-round'){
    const s = await loadSession(state.code) || state.session;
    state.session=s;
    state.screen = s.phase==='ended' ? 'team-ended' : 'team-ended';
    render();
  }
  else if(action==='reset'){
    if(state.role==='team' && state.teamId && state.teamToken){
      await markJoinPageNavigation();
      return;
    }
    stopPolling(); stopTicker();
    Object.assign(state, {
      role:null, screen:'landing', code:null, session:null, teamId:null, teamName:null,
      draftProblemIds:[], draftMinutes:20, currentProblemId:null, editingProblem:false,
      draft:{sensor:null,connKey:null}, chainPoolFull:[], chainSeqIds:[], autoEndTriggered:false, error:''
    });
    render();
  }
});

window.addEventListener('beforeunload', ()=>{
  // Do not disqualify on refresh: sessionStorage survives a normal reload.
  // The next load detects a missing tab marker after a real close/reopen.
  if(state.role==='team' && state.code && state.teamId && state.teamToken){
    try{
      const payload=JSON.stringify({code:state.code,teamId:state.teamId,token:state.teamToken,tabId:state.tabId});
      navigator.sendBeacon('/api/team/presence', new Blob([payload],{type:'application/json'}));
    }catch(e){}
  }
});

// ---------- init ----------
(async function init(){
  const params = new URLSearchParams(location.search);
  const sess = params.get('session');
  if(sess && /^[0-9]{4}$/.test(sess)){
    state.code = sess; state.role='team'; state.screen='team-join';
    const wasClosed = await checkClosedOrDuplicatedAttempt(sess);
    if(wasClosed){
      state.error='Your previous quiz window was closed and reopened. That attempt is disqualified.';
    }
  }
  render();

  window.addEventListener('popstate', async ()=>{
    if(state.role==='team' && state.teamId){
      await markJoinPageNavigation();
      history.pushState({blueprintTeam:true,code:state.code},'',location.href);
    }
  });
})();
</script>
