<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shotclock — Live Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.2/confetti.browser.min.js"></script>
<style>
  :root{
    --ink:#12141C;
    --ink-2:#1B1E29;
    --ink-3:#242838;
    --paper:#F5F3EE;
    --slate:#7C8299;
    --amber:#FFB020;
    --cyan:#3FE0C5;
    --coral:#FF5C5C;
    --violet:#8B7CF6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{min-height:100vh;display:flex;flex-direction:column;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0;letter-spacing:-0.01em;}
  .mono{font-family:'Space Mono',monospace;}
  .screen{max-width:960px;margin:0 auto;padding:28px 20px 60px;width:100%;flex:1;}
  .eyebrow{
    text-transform:uppercase;font-size:12px;letter-spacing:0.14em;color:var(--slate);
    font-weight:600;margin-bottom:6px;
  }
  .card{
    background:var(--ink-2);
    border-radius:20px;
    padding:28px;
    border:1px solid rgba(255,255,255,0.05);
  }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--amber);color:var(--ink);border:none;
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;
    padding:14px 26px;border-radius:999px;cursor:pointer;
    text-transform:uppercase;letter-spacing:0.04em;
    transition:transform .12s ease, filter .12s ease;
  }
  .btn:hover{filter:brightness(1.08);transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;}
  .btn-ghost{
    background:transparent;color:var(--paper);border:1.5px solid rgba(255,255,255,0.18);
  }
  .btn-ghost:hover{border-color:var(--paper);filter:none;}
  .btn-cyan{background:var(--cyan);}
  .btn-block{width:100%;}
  input[type=text]{
    width:100%;background:var(--ink);border:1.5px solid rgba(255,255,255,0.12);
    color:var(--paper);font-family:'Inter',sans-serif;font-size:16px;
    padding:14px 16px;border-radius:12px;outline:none;
  }
  input[type=text]:focus{border-color:var(--amber);}
  label{font-size:13px;color:var(--slate);font-weight:600;display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.06em;}
  .field{margin-bottom:16px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .center{text-align:center;}
  .landing-hero{
    text-align:center;padding:70px 20px 40px;
  }
  .landing-hero h1{font-size:56px;line-height:1.02;}
  .landing-hero .accent{color:var(--amber);}
  .landing-hero p{color:var(--slate);font-size:17px;margin:14px auto 34px;max-width:480px;}
  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:560px;margin:0 auto;}
  @media(max-width:560px){.role-grid{grid-template-columns:1fr;} .landing-hero h1{font-size:38px;}}
  .role-card{
    background:var(--ink-2);border:1.5px solid rgba(255,255,255,0.06);border-radius:18px;
    padding:26px 20px;cursor:pointer;text-align:left;transition:border-color .15s ease, transform .15s ease;
  }
  .role-card:hover{border-color:var(--amber);transform:translateY(-2px);}
  .role-card .tag{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--amber);font-weight:700;margin-bottom:10px;}
  .role-card h3{font-size:20px;margin-bottom:6px;}
  .role-card p{color:var(--slate);font-size:14px;margin:0;line-height:1.4;}

  /* clock ring */
  .clockwrap{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .clocklabel{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--slate);font-weight:700;}

  .qbanner{
    background:var(--ink-3);border-radius:16px;padding:18px 22px;margin-bottom:20px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  }
  .qbanner .qnum{color:var(--slate);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;}
  .qbanner .qtext{font-family:'Space Grotesk',sans-serif;font-size:22px;}

  .opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px;}
  @media(max-width:600px){.opt-grid{grid-template-columns:1fr;}}
  .opt{
    display:flex;align-items:center;gap:14px;
    border-radius:16px;padding:20px;cursor:pointer;border:none;text-align:left;
    font-family:'Inter',sans-serif;font-size:17px;font-weight:600;color:var(--ink);
    transition:transform .1s ease, filter .12s ease; width:100%;
  }
  .opt:hover{filter:brightness(1.06);}
  .opt:active{transform:scale(0.98);}
  .opt:disabled{opacity:.55;cursor:not-allowed;}
  .opt .badge{
    width:34px;height:34px;border-radius:10px;background:rgba(0,0,0,0.18);
    display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;
    font-weight:700;flex-shrink:0;
  }
  .opt-0{background:var(--cyan);} .opt-1{background:var(--amber);}
  .opt-2{background:var(--coral);color:var(--paper);} .opt-2 .badge{background:rgba(255,255,255,0.18);}
  .opt-3{background:var(--violet);color:var(--paper);} .opt-3 .badge{background:rgba(255,255,255,0.18);}

  .opt.correct{outline:3px solid var(--cyan);}
  .opt.wrong{outline:3px solid var(--coral);opacity:0.5;}

  table{width:100%;border-collapse:collapse;}
  th,td{text-align:left;padding:12px 10px;border-bottom:1px solid rgba(255,255,255,0.06);font-size:14px;}
  th{color:var(--slate);text-transform:uppercase;letter-spacing:.06em;font-size:11px;font-weight:700;}
  td.pts{font-family:'Space Mono',monospace;color:var(--cyan);font-weight:700;}
  td.pts.zero{color:var(--slate);}

  .lead-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,0.06);}
  .lead-rank{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;color:var(--slate);width:34px;}
  .lead-rank.gold{color:var(--amber);}
  .lead-name{flex:1;font-weight:600;}
  .lead-score{font-family:'Space Mono',monospace;font-weight:700;color:var(--cyan);}

  .qr-box{background:var(--paper);padding:14px;border-radius:16px;display:inline-block;}
  .code-display{font-family:'Space Mono',monospace;font-size:44px;letter-spacing:0.1em;color:var(--amber);}
  .pill{
    display:inline-block;background:var(--ink-3);color:var(--slate);font-size:12px;font-weight:700;
    padding:6px 14px;border-radius:999px;text-transform:uppercase;letter-spacing:.06em;
  }
  .pill.live{background:rgba(63,224,197,0.14);color:var(--cyan);}
  .qlist-item{
    display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
    padding:14px 0;border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .qlist-item:last-child{border-bottom:none;}
  .qlist-item p{margin:0;font-weight:600;}
  .qlist-item .opts-mini{color:var(--slate);font-size:13px;margin-top:4px;}
  .topbar{
    display:flex;justify-content:space-between;align-items:center;padding:18px 24px;
    border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .topbar .brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;letter-spacing:-0.02em;}
  .brand .dot{color:var(--amber);}
  .footnote{color:var(--slate);font-size:13px;margin-top:10px;line-height:1.5;}
  .divider{height:1px;background:rgba(255,255,255,0.06);margin:24px 0;}
  .empty{color:var(--slate);font-size:14px;padding:20px 0;}
  .status-banner{
    text-align:center;padding:40px 20px;color:var(--slate);
  }
  .status-banner h2{color:var(--paper);margin-bottom:8px;}
  .team-chip{
    display:inline-flex;align-items:center;gap:8px;background:var(--ink-3);padding:8px 14px;
    border-radius:999px;font-size:13px;font-weight:600;
  }
  select{
    width:100%;background:var(--ink);border:1.5px solid rgba(255,255,255,0.12);color:var(--paper);
    padding:14px 16px;border-radius:12px;font-family:'Inter',sans-serif;font-size:15px;
  }

  /* ---- new: round-type + flourish styles ---- */
  .tf-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px;}
  @media(max-width:520px){.tf-grid{grid-template-columns:1fr;}}
  .tf-opt{
    display:flex;align-items:center;justify-content:center;gap:10px;
    border-radius:16px;padding:28px;cursor:pointer;border:none;text-align:center;
    font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;color:var(--ink);
    transition:transform .1s ease, filter .12s ease; width:100%;
  }
  .tf-opt:hover{filter:brightness(1.06);}
  .tf-opt:active{transform:scale(0.98);}
  .tf-opt:disabled{opacity:.55;cursor:not-allowed;}
  .tf-opt.true-opt{background:var(--cyan);}
  .tf-opt.false-opt{background:var(--coral);color:var(--paper);}
  .tf-opt.correct{outline:3px solid var(--cyan);}
  .tf-opt.wrong{outline:3px solid var(--coral);opacity:0.5;}

  .pic-frame{
    width:100%;max-height:320px;overflow:hidden;border-radius:16px;margin-top:16px;
    background:var(--ink-3);display:flex;align-items:center;justify-content:center;
  }
  .pic-frame img{width:100%;max-height:320px;object-fit:cover;transition:filter .3s linear;}

  .overload-badge{
    display:inline-flex;align-items:center;gap:6px;background:rgba(255,92,92,0.15);color:var(--coral);
    font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
    padding:5px 12px;border-radius:999px;margin-bottom:8px;
  }
  .streak-flame{color:var(--amber);font-weight:700;font-size:13px;margin-top:6px;}

  .powerup-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
  .btn-power{
    background:var(--ink-3);color:var(--paper);border:1.5px solid rgba(255,255,255,0.14);
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;
    padding:10px 16px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  }
  .btn-power:hover{border-color:var(--cyan);}
  .btn-power:disabled{opacity:0.35;cursor:not-allowed;}
  .btn-power.steal{border-color:rgba(255,92,92,0.4);}
  .btn-power.steal:hover{border-color:var(--coral);}

  .roast{
    margin-top:14px;background:rgba(255,176,32,0.1);border:1px solid rgba(255,176,32,0.25);
    color:var(--amber);padding:12px 16px;border-radius:12px;font-size:13px;font-weight:600;
  }

  .podium{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin:30px 0 10px;}
  .podium-col{
    width:110px;border-radius:16px 16px 0 0;display:flex;flex-direction:column;align-items:center;
    justify-content:flex-end;padding:14px 8px;text-align:center;
    animation:podium-rise .6s cubic-bezier(.2,.8,.3,1.2) both;
  }
  @keyframes podium-rise{from{transform:translateY(40px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .podium-col .medal{font-size:26px;margin-bottom:6px;}
  .podium-col .pname{font-weight:700;font-size:13px;margin-bottom:2px;word-break:break-word;}
  .podium-col .pscore{font-family:'Space Mono',monospace;font-size:12px;color:var(--ink);opacity:.75;}
  .podium-col.gold{background:var(--amber);height:170px;order:2;}
  .podium-col.silver{background:#C9CEDB;height:130px;order:1;}
  .podium-col.bronze{background:#E0A672;height:105px;order:3;}
  .podium-col.gold *{color:var(--ink);}

  .hub-pulse{ animation: hub-glow 1.6s ease-in-out infinite; }
  @keyframes hub-glow{
    0%,100%{ filter: drop-shadow(0 0 0px rgba(255,176,32,0.6)); }
    50%{ filter: drop-shadow(0 0 20px rgba(255,176,32,0.95)); }
  }

  .pill{
    display:inline-block;background:rgba(255,255,255,0.08);color:var(--slate);
    font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    padding:3px 9px;border-radius:999px;vertical-align:middle;
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------------------------------------------------------
   SHOTCLOCK — live MCQ quiz app
   State synced through window.storage shared blobs so any
   device that opens this same page (e.g. via QR code) can
   join a session and answer in real time.
--------------------------------------------------------- */

const QUESTION_SECONDS = 30;

const state = {
  role: null,          // 'host' | 'team'
  screen: 'landing',
  code: null,
  session: null,       // latest fetched session object
  teamId: null,
  teamName: null,
  answeredIndex: -1,   // last question index this team has locked in an answer for
  newQ: { type:'mcq', text:'', opts:['','','',''], correct:0, tfAnswer:true, imageUrl:'', emojiClue:'', scrambled:'', optionA:'', optionB:'', doublePoints:false }, // draft question form
  pollTimer: null,
  tickTimer: null,
  lastBeepSecond: null, // guards against re-beeping on the same second during a tick
  celebratedIndex: -1,  // guards against re-firing confetti for the same question
  autoRevealedIndex: -1, // guards against re-triggering auto-reveal for the same question
  error: ''
};

const ROASTS = [
  "Signal's weaker than a LoRaWAN packet in a thunderstorm ⛈️📡",
  "Did your Wi-Fi drop, or was that just your brain? 🐢",
  "Buffering... buffering... still buffering. 😴",
  "That response time needs its own firmware update. 🔧",
  "Latency levels: dial-up modem. 📠",
  "Somewhere, a sensor is reporting faster than that. 🐌"
];

const NAME_SUGGESTIONS = [
  "Byte Me", "404 Signal Not Found", "The Overheated Sensors", "Ctrl+Alt+IoT",
  "Wi-Fi Warriors", "The Packet Sniffers", "Segmentation Fault Squad", "Null Pointer Ninjas",
  "The Baud Rates", "Firmware Over the Air", "Latency Legends", "The Edge Cases"
];

function roundTypeLabel(q){
  switch(q.type){
    case 'truefalse': return 'True or False Blitz';
    case 'picture': return 'Picture Reveal';
    case 'emoji': return 'Emoji Riddle';
    case 'oddone': return 'Odd One Out';
    case 'anagram': return 'Anagram Sprint';
    case 'thisorthat': return 'This or That';
    case 'bluff': return 'Bluff Round';
    default: return 'Multiple Choice';
  }
}

// ---------- sound effects (generated in-browser, no external audio files) ----------
let _actx = null;
function beep(freq, durMs, type){
  try{
    if(!_actx) _actx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = _actx.createOscillator();
    const gain = _actx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.06, _actx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, _actx.currentTime + durMs/1000);
    osc.connect(gain); gain.connect(_actx.destination);
    osc.start(); osc.stop(_actx.currentTime + durMs/1000);
  }catch(e){ /* audio not available — fail silently */ }
}
function playConnectSound(){ beep(880,90,'square'); setTimeout(()=>beep(1320,120,'square'),90); }
function playLowBatterySound(){ beep(220,80,'sine'); }
function playFreezeSound(){ beep(1600,60,'sine'); setTimeout(()=>beep(1200,60,'sine'),60); setTimeout(()=>beep(800,90,'sine'),120); }
function playStealSound(){ beep(180,50,'sawtooth'); setTimeout(()=>beep(140,140,'sawtooth'),50); }

function fireConfetti(){
  if(window.confetti){
    window.confetti({ particleCount:80, spread:70, origin:{y:0.6}, colors:['#3FE0C5','#FFB020','#8B7CF6'] });
  }
}

// ---------- storage helpers ----------
async function loadSession(code) {
    try {
        const response = await fetch(`/api/session/${code}`);

        if (!response.ok) {
            return null;
        }

        return await response.json();

    } catch (error) {
        console.error("Load session error:", error);
        return null;
    }
}


async function saveSession(code, obj) {
    try {
        const response = await fetch(`/api/session/${code}`, {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(obj)
        });

        return response.ok;

    } catch (error) {
        console.error("Save session error:", error);
        return false;
    }
}
function randCode(){
  return String(Math.floor(1000 + Math.random()*9000));
}
function randId(){
  return Math.random().toString(36).slice(2,9);
}

function blankSession(){
  return {
    createdAt: Date.now(),
    questions: [],
    teams: {},          // teamId -> name
    scores: {},          // teamId -> total points
    currentIndex: -1,
    phase: 'setup',      // setup | lobby | question | reveal | finished
    questionStartedAt: null,
    answers: {},          // qIndex -> { teamId: {selected,timeMs,correct,points} }
    streaks: {},           // teamId -> current consecutive-correct streak
    powerups: {},          // teamId -> {freeze, steal} charges remaining
    frozenTargets: {},      // qIndex -> [teamId, ...] teams jammed for that question
    freezeUsedBy: {},        // qIndex -> [teamId, ...] teams who have already spent a freeze this question
    stolenLog: {}           // qIndex -> [teamId, ...] teams who already used a steal that round
  };
}

// Base points from speed alone (before streak/overload/freeze modifiers).
function basePoints(timeMs, correct){
  if(!correct) return 0;
  const sec = Math.min(timeMs/1000, QUESTION_SECONDS);
  return Math.max(100, Math.round(1000 - (900 * sec/QUESTION_SECONDS)));
}

// Full scoring pipeline: speed -> streak multiplier -> overload penalty -> freeze cap.
function computePoints(opts){
  const { timeMs, correct, streakBefore, doublePoints, frozen } = opts;
  const effectiveTimeMs = frozen ? QUESTION_SECONDS*1000 : timeMs; // jammed signal = worst-case timing
  let pts = basePoints(effectiveTimeMs, correct);

  if(correct){
    if(streakBefore >= 2) pts = Math.round(pts * 1.5); // Strong Signal: 3rd correct-in-a-row and beyond
    if(doublePoints) pts = pts * 2;                     // System Overload: correct pays double
  } else if(doublePoints){
    pts = -500;                                          // System Overload: wrong costs points
  }
  return pts;
}

// ---------- polling ----------
function startPolling(){
  stopPolling();
  state.pollTimer = setInterval(async ()=>{
    if(!state.code) return;
    const s = await loadSession(state.code);
    if(s){
      const prevPhase = state.session ? state.session.phase : null;
      const prevIndex = state.session ? state.session.currentIndex : null;
      state.session = s;
      autoAdvanceScreen(prevPhase, prevIndex);
      await maybeAutoReveal(s);
    }
    render();
  }, 1200);
}
function stopPolling(){
  if(state.pollTimer) clearInterval(state.pollTimer);
  state.pollTimer = null;
}
function startTicker(){
  stopTicker();
  state.tickTimer = setInterval(render, 250);
}
function stopTicker(){
  if(state.tickTimer) clearInterval(state.tickTimer);
  state.tickTimer = null;
}

function autoAdvanceScreen(prevPhase, prevIndex){
  const s = state.session;
  if(!s) return;
  if(state.role === 'team'){
    if(s.phase === 'lobby') state.screen = 'team-wait';
    else if(s.phase === 'question'){
      if(state.answeredIndex === s.currentIndex) state.screen = 'team-answered';
      else state.screen = 'team-question';
    } else if(s.phase === 'reveal') state.screen = 'team-reveal';
    else if(s.phase === 'finished') state.screen = 'team-finished';
  }
}

// Host-side: once every joined team has locked in an answer for the live question,
// automatically flip to the reveal screen (answers + points) instead of making the
// host click a button — the host still has to click "Next Question" to move on.
async function maybeAutoReveal(s){
  if(state.role !== 'host') return;
  if(s.phase !== 'question') return;
  const idx = s.currentIndex;
  if(state.autoRevealedIndex === idx) return;
  const totalTeams = Object.keys(s.teams).length;
  if(totalTeams === 0) return;
  const answeredCount = Object.keys(s.answers[idx] || {}).length;
  if(answeredCount >= totalTeams){
    state.autoRevealedIndex = idx;
    await handleRevealNow();
  }
}

function remainingSeconds(){
  const s = state.session;
  if(!s || !s.questionStartedAt) return QUESTION_SECONDS;
  const elapsed = (Date.now() - s.questionStartedAt)/1000;
  return Math.max(0, Math.ceil(QUESTION_SECONDS - elapsed));
}
function elapsedMs(){
  const s = state.session;
  if(!s || !s.questionStartedAt) return 0;
  return Date.now() - s.questionStartedAt;
}

// ---------- clock ring ----------
function clockRing(remaining, total, size){
  size = size || 130;
  const r = size/2 - 10;
  const c = 2*Math.PI*r;
  const frac = Math.max(0, Math.min(1, remaining/total));
  const offset = c * (1-frac);
  const color = remaining <= 10 ? 'var(--coral)' : (remaining <= 30 ? 'var(--amber)' : 'var(--cyan)');
  return `
  <div class="clockwrap">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="8"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${offset}"
        transform="rotate(-90 ${size/2} ${size/2})" style="transition:stroke-dashoffset .25s linear"/>
      <text x="50%" y="53%" text-anchor="middle" fill="var(--paper)" font-family="Space Mono, monospace"
        font-size="${size*0.26}" font-weight="700" dy=".05em">${remaining}</text>
    </svg>
    <div class="clocklabel">seconds left</div>
  </div>`;
}

// ---------- render ----------
function render(){
  const app = document.getElementById('app');
  app.innerHTML = topbar() + '<div class="screen">' + screenHTML() + '</div>';
  afterRender();
}

function topbar(){
  return `<div class="topbar">
    <div class="brand">shot<span class="dot">•</span>clock</div>
    ${state.session ? `<span class="pill ${state.session.phase==='question'?'live':''}">${state.role==='host'?'Hosting':'Playing'} · ${state.code}</span>` : ''}
  </div>`;
}

function screenHTML(){
  switch(state.screen){
    case 'landing': return landingScreen();
    case 'host-setup': return hostSetupScreen();
    case 'host-lobby': return hostLobbyScreen();
    case 'host-question': return hostQuestionScreen();
    case 'host-reveal': return hostRevealScreen();
    case 'host-finished': return hostFinishedScreen();
    case 'team-join': return teamJoinScreen();
    case 'team-wait': return teamWaitScreen();
    case 'team-question': return teamQuestionScreen();
    case 'team-answered': return teamAnsweredScreen();
    case 'team-reveal': return teamRevealScreen();

}

// A short "clue" line shown above the answer options for round types that need one.

function questionBodyStatic(q, rem){
  if(q.type === 'truefalse'){
    return `<div class="tf-grid">

      <div class="tf-opt false-opt" style="cursor:default;">✗ False</div>

    <div class="opt-grid">
      ${q.options.map((opt,i)=>`

          <span class="badge">${String.fromCharCode(65+i)}</span><span>${escapeHtml(opt)}</span>
        </div>`).join('')}
    </div>`;
  }
  return clue + `<div class="opt-grid">
    ${q.options.map((opt,i)=>`
      <div class="opt opt-${i}" style="cursor:default;">
        <span class="badge">${String.fromCharCode(65+i)}</span><span>${escapeHtml(opt)}</span>

}

// ---------- shared: render the "correct answer" reference block for reveal screens ----------
function revealAnswerBlock(q, s, idx){
  if(q.type === 'truefalse'){
    return `<div class="tf-grid">
      <div class="tf-opt true-opt ${q.tfAnswer?'correct':''}" style="cursor:default;">✓ True${q.tfAnswer?' ✓':''}</div>
      <div class="tf-opt false-opt ${!q.tfAnswer?'correct':''}" style="cursor:default;">✗ False${!q.tfAnswer?' ✓':''}</div>
    </div>`;
  }
  if(q.type === 'thisorthat'){
    const answersForQ = (s.answers && s.answers[idx]) || {};
    const vals = Object.values(answersForQ);
    const total = vals.length || 1;
    const countA = vals.filter(a=>a.selected==='A').length;
    const countB = vals.filter(a=>a.selected==='B').length;
    const pctA = Math.round(countA/total*100);
    const pctB = Math.round(countB/total*100);
    return `<div class="tf-grid">
      <div class="tf-opt true-opt" style="cursor:default;flex-direction:column;gap:4px;">
        <span>${escapeHtml(q.optionA)}</span><span style="font-size:26px;">${pctA}%</span>
      </div>
      <div class="tf-opt false-opt" style="cursor:default;flex-direction:column;gap:4px;">
        <span>${escapeHtml(q.optionB)}</span><span style="font-size:26px;">${pctB}%</span>
      </div>
    </div>`;
  }
  const clue = questionExtraClue(q);
  const imgBlock = q.type === 'picture' ? `<div class="pic-frame"><img src="${escapeHtml(q.imageUrl)}" alt=""></div>` : '';
  return imgBlock + clue + `<div class="opt-grid">
    ${q.options.map((opt,i)=>`
      <div class="opt opt-${i} ${i===q.correct?'correct':''}" style="cursor:default;">
        <span class="badge">${String.fromCharCode(65+i)}</span><span>${escapeHtml(opt)}${i===q.correct?' ✓':''}</span>
      </div>`).join('')}
  </div>`;
}
function formatAnswer(q, selected){
  if(q.type === 'truefalse') return selected ? 'True' : 'False';
  if(q.type === 'thisorthat') return selected === 'A' ? q.optionA : q.optionB;
  return String.fromCharCode(65+selected);
}

  return `

// Podium reimagined as a network diagram: rank 1 is the glowing central hub,
// everyone else branches off as connected nodes — sized/colored by rank.
function networkTopologyHTML(ranked){
  if(ranked.length===0) return `<div class="empty">No teams yet.</div>`;
  const hub = ranked[0];
  const spokes = ranked.slice(1,6); // show up to 5 orbiting nodes for clarity
  const size = 420;
  const cx = size/2, cy = size/2 - 6;
  const hubR = 46, spokeR = 30, orbit = 150;
  const n = spokes.length;

  const nodes = spokes.map((r,i)=>{
    const angle = n>0 ? (i/n)*Math.PI*2 - Math.PI/2 : 0;
    return { ...r, x: cx + orbit*Math.cos(angle), y: cy + orbit*Math.sin(angle), rank: i+2 };
  });

  const lines = nodes.map(node=>
    `<line x1="${cx}" y1="${cy}" x2="${node.x.toFixed(1)}" y2="${node.y.toFixed(1)}" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>`
  ).join('');

  const nodeColor = (i)=> i===0 ? '#C9CEDB' : i===1 ? '#E0A672' : '#3A3F52';

  const circles = nodes.map((node,i)=>`
    <circle cx="${node.x.toFixed(1)}" cy="${node.y.toFixed(1)}" r="${spokeR}" fill="${nodeColor(i)}" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
    <text x="${node.x.toFixed(1)}" y="${(node.y+spokeR+18).toFixed(1)}" text-anchor="middle" fill="var(--paper)" font-family="Space Grotesk, sans-serif" font-size="12" font-weight="700">${escapeHtml(node.name)}</text>
    <text x="${node.x.toFixed(1)}" y="${(node.y+spokeR+33).toFixed(1)}" text-anchor="middle" fill="var(--slate)" font-family="Space Mono, monospace" font-size="10">${node.score} pts</text>
  `).join('');

  return `
  <div class="center" style="overflow-x:auto;">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="max-width:100%;height:auto;">
      ${lines}
      <circle cx="${cx}" cy="${cy}" r="${hubR}" fill="var(--amber)" class="hub-pulse"/>
      <text x="${cx}" y="${cy-4}" text-anchor="middle" fill="var(--ink)" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="14">${escapeHtml(hub.name)}</text>
      <text x="${cx}" y="${cy+15}" text-anchor="middle" fill="var(--ink)" font-family="Space Mono, monospace" font-size="12">${hub.score} pts</text>
      ${circles}
    </svg>
  </div>
  ${ranked.length>6 ? `<p class="footnote center" style="text-align:center;">+${ranked.length-6} more team${ranked.length-6===1?'':'s'} in the full leaderboard below</p>` : ''}
  `;
}

function leaderboardHTML(s){
  const ids = Object.keys(s.teams);
  const ranked = ids.map(id=>({id, name:s.teams[id], score:s.scores[id]||0})).sort((a,b)=>b.score-a.score);
  if(ranked.length===0) return `<div class="empty">No teams yet.</div>`;
  return ranked.map((r,i)=>`
    <div class="lead-row">
      <div class="lead-rank ${i===0?'gold':''}">${i+1}</div>
      <div class="lead-name">${escapeHtml(r.name)}</div>
      <div class="lead-score">${r.score} pts</div>
    </div>
  `).join('');
}

function teamQuestionScreen(){
  const s = state.session;
  const idx = s.currentIndex;
  const q = s.questions[idx];
  const rem = remainingSeconds();
  const timeUp = rem <= 0;
  const myPowerups = (s.powerups && s.powerups[state.teamId]) || {freeze:0, steal:0};
  const alreadyFroze = myFreezeUsedThisQuestion(s, idx);
  const rivalTeams = Object.keys(s.teams).filter(id=>id!==state.teamId);
  const iAmFrozen = ((s.frozenTargets && s.frozenTargets[idx]) || []).includes(state.teamId);

  let body;
  if(q.type === 'truefalse'){
    body = `<div class="tf-grid">
      <button class="tf-opt true-opt" data-action="submit-answer" data-idx="true" ${timeUp?'disabled':''}>✓ True</button>
      <button class="tf-opt false-opt" data-action="submit-answer" data-idx="false" ${timeUp?'disabled':''}>✗ False</button>
    </div>`;
  } else if(q.type === 'thisorthat'){
    body = `<div class="tf-grid">
      <button class="tf-opt true-opt" data-action="submit-answer" data-idx="A" ${timeUp?'disabled':''}>${escapeHtml(q.optionA)}</button>
      <button class="tf-opt false-opt" data-action="submit-answer" data-idx="B" ${timeUp?'disabled':''}>${escapeHtml(q.optionB)}</button>
    </div>`;
  } else if(q.type === 'picture'){
    const blur = Math.max(0, Math.min(20, Math.round(rem/QUESTION_SECONDS*20)));
    body = `<div class="pic-frame"><img src="${escapeHtml(q.imageUrl)}" style="filter:blur(${blur}px);" alt=""></div>
    <div class="opt-grid">
      ${q.options.map((opt,i)=>`
        <button class="opt opt-${i}" data-action="submit-answer" data-idx="${i}" ${timeUp?'disabled':''}>
          <span class="badge">${String.fromCharCode(65+i)}</span><span>${escapeHtml(opt)}</span>
        </button>`).join('')}
    </div>`;
  } else {
    body = questionExtraClue(q) + `<div class="opt-grid">
      ${q.options.map((opt,i)=>`
        <button class="opt opt-${i}" data-action="submit-answer" data-idx="${i}" ${timeUp?'disabled':''}>
          <span class="badge">${String.fromCharCode(65+i)}</span><span>${escapeHtml(opt)}</span>
        </button>`).join('')}
    </div>`;
  }

  return `
  <div class="qbanner">
    <div>
      <div class="qnum">Question ${idx+1} of ${s.questions.length} · ${roundTypeLabel(q)}</div>
      ${q.doublePoints ? `<div class="overload-badge">🎯 System Overload — Double or Nothing</div>` : ''}
      <div class="qtext">${escapeHtml(q.text)}</div>
    </div>
    ${clockRing(rem, QUESTION_SECONDS, 88)}
  </div>
  ${iAmFrozen ? `<div class="roast" style="background:rgba(63,224,197,0.1);border-color:rgba(63,224,197,0.3);color:var(--cyan);">❄️ Your frequency's been jammed this round — your timing will be scored at worst-case, so just try to answer correctly!</div>` : ''}
  ${body}
  ${(!timeUp && q.type!=='thisorthat' && myPowerups.freeze > 0 && rivalTeams.length > 0 && !alreadyFroze) ? `
  <div class="powerup-row">
    ${rivalTeams.map(tid=>`<button class="btn-power" data-action="use-freeze" data-target="${tid}">❄️ Jam the Frequency — ${escapeHtml(s.teams[tid])}</button>`).join('')}
  </div>
  <p class="footnote" style="margin-top:6px;">You have ${myPowerups.freeze} freeze charge${myPowerups.freeze===1?'':'s'} left.</p>
  ` : ''}
  ${alreadyFroze ? `<p class="footnote" style="margin-top:10px;">❄️ Frequency jam already used this round.</p>` : ''}
  ${timeUp ? `<p class="footnote center" style="text-align:center;margin-top:14px;">Time's up — waiting for the host to reveal results.</p>`:''}
  `;
}

// has THIS team already spent a freeze charge on the current question index?
function myFreezeUsedThisQuestion(s, idx){
  return !!((s.freezeUsedBy && s.freezeUsedBy[idx] && s.freezeUsedBy[idx].includes(state.teamId)));
}

function teamAnsweredScreen(){
  const s = state.session;
  const idx = s.currentIndex;
  const q = s.questions[idx];
  const mine = (s.answers[idx]||{})[state.teamId];
  const rem = remainingSeconds();
  return `
  <div class="status-banner">
    ${clockRing(rem, QUESTION_SECONDS, 88)}
    <h2 style="margin-top:18px;">Answer locked in</h2>
    <p>You chose <strong>${mine? formatAnswer(q, mine.selected):'—'}</strong> in ${mine?(mine.timeMs/1000).toFixed(1):'—'}s. Waiting on other teams…</p>
    ${mine && mine.frozen ? `<p class="footnote" style="color:var(--cyan);">❄️ Your frequency was jammed this round.</p>` : ''}
  </div>
  `;
}

function teamRevealScreen(){
  const s = state.session;
  const idx = s.currentIndex;
  const q = s.questions[idx];
  const mine = (s.answers[idx]||{})[state.teamId];
  const isLast = idx >= s.questions.length -1;

  const ids = Object.keys(s.teams);
  const ranked = ids.map(id=>({id, score:s.scores[id]||0})).sort((a,b)=>b.score-a.score);
  const myRank = ranked.findIndex(r=>r.id===state.teamId);
  const isLastPlace = ranked.length > 1 && myRank === ranked.length-1;
  const myPowerups = (s.powerups && s.powerups[state.teamId]) || {freeze:0, steal:0};
  const alreadyStolen = ((s.stolenLog && s.stolenLog[idx]) || []).includes(state.teamId);
  const canSteal = mine && mine.correct && isLastPlace && myPowerups.steal > 0 && !alreadyStolen;

  let renderedOptions;
  if(q.type === 'truefalse'){
    renderedOptions = `<div class="tf-grid">
      <div class="tf-opt true-opt ${q.tfAnswer?'correct':(mine && mine.selected===true && !mine.correct?'wrong':'')}" style="cursor:default;">✓ True${q.tfAnswer?' ✓':''}</div>
      <div class="tf-opt false-opt ${!q.tfAnswer?'correct':(mine && mine.selected===false && !mine.correct?'wrong':'')}" style="cursor:default;">✗ False${!q.tfAnswer?' ✓':''}</div>
    </div>`;
  } else if(q.type === 'thisorthat'){
    renderedOptions = revealAnswerBlock(q, s, idx);
  } else {
    const clue = questionExtraClue(q);
    const imgBlock = q.type === 'picture' ? `<div class="pic-frame"><img src="${escapeHtml(q.imageUrl)}" alt=""></div>` : '';
    renderedOptions = imgBlock + clue + `<div class="opt-grid">
      ${q.options.map((opt,i)=>`
        <div class="opt opt-${i} ${i===q.correct?'correct':(mine && mine.selected===i && i!==q.correct?'wrong':'')}" style="cursor:default;">
          <span class="badge">${String.fromCharCode(65+i)}</span><span>${escapeHtml(opt)}${i===q.correct?' ✓':''}</span>
        </div>`).join('')}
    </div>`;
  }

  return `
  <div class="qbanner">
    <div>
      <div class="qnum">Question ${idx+1} of ${s.questions.length} — Results</div>
      <div class="qtext">${escapeHtml(q.text)}</div>
    </div>
  </div>
  ${renderedOptions}
  <div class="divider"></div>
  <div class="card center">
    ${q.type === 'thisorthat'
      ? `<h2 style="color:var(--slate);">Just for laughs — no points this round 🎭</h2>
         <p class="footnote">${mine ? 'You picked: '+escapeHtml(formatAnswer(q, mine.selected)) : 'No answer submitted.'}</p>`
      : mine
      ? `<h2 style="color:${mine.points>0?'var(--cyan)':(mine.points<0?'var(--coral)':'var(--slate)')};">${mine.points!==0? (mine.points>0?'+':'')+mine.points+' points':'No points'}</h2>
         <p class="footnote">${mine.correct? 'Nice — answered correctly in '+(mine.timeMs/1000).toFixed(1)+'s.' : (mine.points<0 ? 'System Overload — wrong answers cost points this time.' : 'Not quite this round.')}</p>
         ${mine.frozen ? `<p class="footnote" style="color:var(--cyan);">❄️ Your frequency was jammed this round — timing was capped.</p>` : ''}
         ${mine.correct && mine.streakBefore>=2 ? `<div class="streak-flame">🔥 Strong Signal! x1.5 streak bonus applied.</div>` : ''}
         ${!mine.correct && mine.streakBefore>=1 ? `<div class="footnote" style="color:var(--coral);">📉 Signal Dropped — streak reset.</div>` : ''}`
      : `<h2 style="color:var(--slate);">No answer submitted</h2>`}
  </div>
  ${canSteal ? `<div class="center" style="margin-top:14px;">
    <button class="btn-power steal" data-action="use-steal">🏴‍☠️ Data Breach — steal 150 pts from the leader</button>
  </div>` : ''}
  <div class="divider"></div>
  <h3 style="margin-bottom:10px;">Leaderboard</h3>
  <div class="card">${leaderboardHTML(s)}</div>
  <p class="footnote center" style="text-align:center;margin-top:14px;">${isLast? 'Waiting for host to finish the quiz…' : 'Waiting for the host to start the next question…'}</p>
  `;
}

function teamFinishedScreen(){
  const s = state.session;
  const ids = Object.keys(s.teams);
  const ranked = ids.map(id=>({id, score:s.scores[id]||0})).sort((a,b)=>b.score-a.score);
  const myRank = ranked.findIndex(r=>r.id===state.teamId) + 1;
  return `
  <div class="status-banner">
    <div class="eyebrow">Quiz complete</div>
    <h2>${escapeHtml(state.teamName)} finished #${myRank||'-'}</h2>
  </div>
  <div class="card">${leaderboardHTML(s)}</div>
  `;
}

// ---------- helpers ----------
function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ---------- render side-effects (QR code, timers, sound & confetti flourishes) ----------
function afterRender(){
  if(state.screen === 'host-lobby'){
    const holder = document.getElementById('qrHolder');
    if(holder && window.QRCode){
      holder.innerHTML = '';
      const joinUrl = location.origin + location.pathname + '?session=' + state.code;
      new QRCode(holder, { text: joinUrl, width:180, height:180, colorDark:'#12141C', colorLight:'#F5F3EE' });
    }
  }
  const runningTimer = state.screen === 'host-question' || state.screen === 'team-question' || state.screen === 'team-answered';
  if(runningTimer) startTicker(); else stopTicker();

  // Low-battery beep in the final 5 seconds of a live question (host & team screens).
  if(state.screen === 'host-question' || state.screen === 'team-question'){
    const rem = remainingSeconds();
    if(rem > 0 && rem <= 5 && state.lastBeepSecond !== rem){
      state.lastBeepSecond = rem;
      playLowBatterySound();
    }
    if(rem > 5) state.lastBeepSecond = null;
  }

  // Confetti burst the first time a team sees they answered correctly this round.
  if(state.screen === 'team-reveal' && state.session){
    const idx = state.session.currentIndex;
    const mine = (state.session.answers[idx]||{})[state.teamId];
    if(mine && mine.correct && state.celebratedIndex !== idx){
      state.celebratedIndex = idx;
      fireConfetti();
    }
  }
}

// ---------- actions ----------
async function handleAddQuestion(){
  const type = document.getElementById('qtype').value;
  const text = document.getElementById('qtext').value.trim();
  const doublePoints = type === 'thisorthat' ? false : document.getElementById('doublePoints').checked;
  if(!text){ state.error = 'Fill in the question/prompt text.'; render(); return; }

  let newQuestion;
  if(type === 'truefalse'){
    const tfAnswer = document.getElementById('tfSelect').value === 'true';
    newQuestion = { type, text, tfAnswer, doublePoints };
  } else if(type === 'thisorthat'){
    const optionA = document.getElementById('optionA').value.trim();
    const optionB = document.getElementById('optionB').value.trim();
    if(!optionA || !optionB){ state.error = 'Fill in both Option A and Option B.'; render(); return; }
    newQuestion = { type, text, optionA, optionB, doublePoints:false };
  } else {
    // mcq, picture, emoji, oddone, anagram, bluff all share the 4-option shape
    const opts = [0,1,2,3].map(i=>document.getElementById('opt'+i).value.trim());
    const correct = parseInt(document.getElementById('correctSelect').value, 10);
    if(opts.some(o=>!o)){ state.error = 'Fill in all four options.'; render(); return; }
    newQuestion = { type, text, options: opts, correct, doublePoints };
    if(type === 'picture'){
      const imageUrl = document.getElementById('imageUrl').value.trim();
      if(!imageUrl){ state.error = 'Add an image URL for a Picture Reveal round.'; render(); return; }
      newQuestion.imageUrl = imageUrl;
    }
    if(type === 'emoji'){
      const emojiClue = document.getElementById('emojiClue').value.trim();
      if(!emojiClue){ state.error = 'Add the emoji clue for an Emoji Riddle round.'; render(); return; }
      newQuestion.emojiClue = emojiClue;
    }
    if(type === 'anagram'){
      const scrambled = document.getElementById('scrambled').value.trim();
      if(!scrambled){ state.error = 'Add the scrambled word/phrase for an Anagram Sprint round.'; render(); return; }
      newQuestion.scrambled = scrambled;
    }
  }

  state.error = '';
  const s = state.session;
  s.questions.push(newQuestion);
  await saveSession(state.code, s);
  state.newQ = { type:'mcq', text:'', opts:['','','',''], correct:0, tfAnswer:true, imageUrl:'', emojiClue:'', scrambled:'', optionA:'', optionB:'', doublePoints:false };
  render();
}

async function handleDeleteQuestion(idx){
  const s = state.session;
  s.questions.splice(idx,1);
  await saveSession(state.code, s);
  render();
}

async function handleOpenLobby(){
  const s = state.session;
  s.phase = 'lobby';
  await saveSession(state.code, s);
  state.screen = 'host-lobby';
  startPolling();
  render();
}

async function handleStartQuiz(){
  const s = await loadSession(state.code) || state.session;
  s.phase = 'question';
  s.currentIndex = 0;
  s.questionStartedAt = Date.now();
  await saveSession(state.code, s);
  state.session = s;
  state.screen = 'host-question';
  render();
}

async function handleRevealNow(){
  const s = await loadSession(state.code) || state.session;
  s.phase = 'reveal';
  await saveSession(state.code, s);
  state.session = s;
  state.screen = 'host-reveal';
  render();
}

async function handleNextQuestion(){
  const s = await loadSession(state.code) || state.session;
  const isLast = s.currentIndex >= s.questions.length -1;
  if(isLast){
    s.phase = 'finished';
    await saveSession(state.code, s);
    state.session = s;
    state.screen = 'host-finished';
  } else {
    s.currentIndex += 1;
    s.phase = 'question';
    s.questionStartedAt = Date.now();
    await saveSession(state.code, s);
    state.session = s;
    state.screen = 'host-question';
  }
  render();
}

async function handleJoinSession(){
  const code = document.getElementById('joinCode').value.trim();
  const name = document.getElementById('joinName').value.trim();
  if(!/^[0-9]{4}$/.test(code)){ state.error='Enter a valid 4-digit code.'; render(); return; }
  if(!name){ state.error='Enter a team name.'; render(); return; }
  const s = await loadSession(code);
  if(!s){ state.error='No session found with that code.'; render(); return; }
  state.error = '';
  const teamId = randId();
  s.teams[teamId] = name;
  s.scores[teamId] = 0;
  s.streaks[teamId] = 0;
  s.powerups[teamId] = { freeze: 1, steal: 1 };
  await saveSession(code, s);
  state.code = code;
  state.session = s;
  state.teamId = teamId;
  state.teamName = name;
  state.role = 'team';
  state.screen = s.phase === 'lobby' ? 'team-wait' : (s.phase==='question' ? 'team-question' : 'team-wait');
  startPolling();
  render();
}

async function handleSubmitAnswer(rawSelected){
  const s = await loadSession(state.code) || state.session;
  const qIdx = s.currentIndex;
  if(s.answers[qIdx] && s.answers[qIdx][state.teamId]) return; // already answered
  const timeMs = Date.now() - s.questionStartedAt;
  const q = s.questions[qIdx];

  if(q.type === 'thisorthat'){
    // Just-for-laughs poll: no correct answer, no points, streak untouched.
    if(!s.answers[qIdx]) s.answers[qIdx] = {};
    s.answers[qIdx][state.teamId] = { selected: rawSelected, timeMs, correct: null, points: 0, streakBefore: (s.streaks&&s.streaks[state.teamId])||0, frozen:false };
    await saveSession(state.code, s);
    state.session = s;
    state.answeredIndex = qIdx;
    state.screen = 'team-answered';
    render();
    return;
  }

  let selected, correct;
  if(q.type === 'truefalse'){
    selected = rawSelected === 'true';
    correct = selected === q.tfAnswer;
  } else {
    selected = parseInt(rawSelected, 10);
    correct = selected === q.correct;
  }

  const streakBefore = (s.streaks && s.streaks[state.teamId]) || 0;
  const frozen = ((s.frozenTargets && s.frozenTargets[qIdx]) || []).includes(state.teamId);
  const points = computePoints({ timeMs, correct, streakBefore, doublePoints: !!q.doublePoints, frozen });

  if(!s.answers[qIdx]) s.answers[qIdx] = {};
  s.answers[qIdx][state.teamId] = { selected, timeMs, correct, points, streakBefore, frozen };
  s.scores[state.teamId] = (s.scores[state.teamId]||0) + points;
  s.streaks = s.streaks || {};
  s.streaks[state.teamId] = correct ? streakBefore + 1 : 0;

  await saveSession(state.code, s);
  state.session = s;
  state.answeredIndex = qIdx;
  state.screen = 'team-answered';
  if(timeMs < 3000 && correct) playConnectSound();
  render();
}

// ❄️ Jam a rival's signal for the current question — costs the caster one freeze charge.
async function handleUseFreeze(targetTeamId){
  const s = await loadSession(state.code) || state.session;
  const qIdx = s.currentIndex;
  s.powerups = s.powerups || {};
  const mine = s.powerups[state.teamId] || { freeze:1, steal:1 };
  if(mine.freeze <= 0) return;
  s.freezeUsedBy = s.freezeUsedBy || {};
  if((s.freezeUsedBy[qIdx]||[]).includes(state.teamId)) return; // one freeze per question

  mine.freeze -= 1;
  s.powerups[state.teamId] = mine;
  s.frozenTargets[qIdx] = s.frozenTargets[qIdx] || [];
  s.frozenTargets[qIdx].push(targetTeamId);
  s.freezeUsedBy[qIdx] = s.freezeUsedBy[qIdx] || [];
  s.freezeUsedBy[qIdx].push(state.teamId);

  await saveSession(state.code, s);
  state.session = s;
  playFreezeSound();
  render();
}

// 🏴‍☠️ Steal Round — the last-place team can steal points from the current leader
// after a round they answered correctly, once per game.
async function handleUseSteal(){
  const s = await loadSession(state.code) || state.session;
  const qIdx = s.currentIndex;
  s.powerups = s.powerups || {};
  const mine = s.powerups[state.teamId] || { freeze:1, steal:1 };
  if(mine.steal <= 0) return;
  s.stolenLog = s.stolenLog || {};
  if((s.stolenLog[qIdx]||[]).includes(state.teamId)) return; // already stolen this round

  const ids = Object.keys(s.teams);
  const ranked = ids.map(id=>({id, score:s.scores[id]||0})).sort((a,b)=>b.score-a.score);
  const leader = ranked[0];
  if(!leader || leader.id === state.teamId) return;

  const STEAL_AMOUNT = 150;
  const taken = Math.min(STEAL_AMOUNT, s.scores[leader.id]||0);
  s.scores[leader.id] = (s.scores[leader.id]||0) - taken;
  s.scores[state.teamId] = (s.scores[state.teamId]||0) + taken;
  mine.steal -= 1;
  s.powerups[state.teamId] = mine;
  s.stolenLog[qIdx] = s.stolenLog[qIdx] || [];
  s.stolenLog[qIdx].push(state.teamId);

  await saveSession(state.code, s);
  state.session = s;
  playStealSound();
  render();
}

// ---------- top-level click handling ----------
document.addEventListener('click', async (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.getAttribute('data-action');

  if(action === 'go-host'){
    state.role = 'host';
    state.code = randCode();
    state.session = blankSession();
    await saveSession(state.code, state.session);
    state.screen = 'host-setup';
    render();
  }
  else if(action === 'go-team-join'){
    state.role = 'team';
    state.screen = 'team-join';
    render();
  }
  else if(action === 'add-question') handleAddQuestion();
  else if(action === 'del-question') handleDeleteQuestion(parseInt(el.getAttribute('data-idx'),10));
  else if(action === 'open-lobby') handleOpenLobby();
  else if(action === 'start-quiz') handleStartQuiz();
  else if(action === 'reveal-now') handleRevealNow();
  else if(action === 'next-question') handleNextQuestion();
  else if(action === 'join-session') handleJoinSession();
  else if(action === 'suggest-name'){
    const pick = NAME_SUGGESTIONS[Math.floor(Math.random()*NAME_SUGGESTIONS.length)];
    const inp = document.getElementById('joinName');
    if(inp) inp.value = pick;
  }
  else if(action === 'submit-answer') handleSubmitAnswer(el.getAttribute('data-idx'));
  else if(action === 'use-freeze') handleUseFreeze(el.getAttribute('data-target'));
  else if(action === 'use-steal') handleUseSteal();
  else if(action === 'reset'){
    stopPolling(); stopTicker();
    Object.assign(state, {
      role:null, screen:'landing', code:null, session:null, teamId:null, teamName:null,
      answeredIndex:-1, newQ:{type:'mcq',text:'',opts:['','','',''],correct:0,tfAnswer:true,imageUrl:'',emojiClue:'',scrambled:'',optionA:'',optionB:'',doublePoints:false},
      lastBeepSecond:null, celebratedIndex:-1, autoRevealedIndex:-1, error:''
    });
    render();
  }
});

// keep draft question text alive across re-renders on this screen (no polling active there)
document.addEventListener('input', (e)=>{
  if(state.screen !== 'host-setup') return;
  const id = e.target.id;
  if(id === 'qtext') state.newQ.text = e.target.value;
  else if(id === 'imageUrl') state.newQ.imageUrl = e.target.value;
  else if(id === 'emojiClue') state.newQ.emojiClue = e.target.value;
  else if(id === 'scrambled') state.newQ.scrambled = e.target.value;
  else if(id === 'optionA') state.newQ.optionA = e.target.value;
  else if(id === 'optionB') state.newQ.optionB = e.target.value;
  else if(id && /^opt[0-3]$/.test(id)) state.newQ.opts[parseInt(id.replace('opt',''),10)] = e.target.value;
  else if(id === 'correctSelect') state.newQ.correct = parseInt(e.target.value,10);
  else if(id === 'doublePoints') state.newQ.doublePoints = e.target.checked;
});
document.addEventListener('change', (e)=>{
  if(state.screen !== 'host-setup') return;
  if(e.target.id === 'correctSelect'){ state.newQ.correct = parseInt(e.target.value,10); render(); }
  else if(e.target.id === 'qtype'){ state.newQ.type = e.target.value; render(); }
  else if(e.target.id === 'tfSelect'){ state.newQ.tfAnswer = e.target.value === 'true'; render(); }
  else if(e.target.id === 'doublePoints'){ state.newQ.doublePoints = e.target.checked; render(); }
});

// ---------- init: auto-detect ?session=CODE for QR joins ----------
(function init(){
  const params = new URLSearchParams(location.search);
  const sess = params.get('session');
  if(sess && /^[0-9]{4}$/.test(sess)){
    state.code = sess;
    state.role = 'team';
    state.screen = 'team-join';
  }
  render();
})();
</script>
